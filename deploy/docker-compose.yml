services:
  mysql:
    image: mysql:8.0
    container_name: labelhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: labelhub
      MYSQL_USER: labelhub
      MYSQL_PASSWORD: labelhub_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "labelhub", "-plabelhub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labelhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: labelhub-adminer
    ports:
      - "18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # asynqmon: 无 arm64 官方镜像,Sprint 3 前手动 build
  # go install github.com/hibiken/asynqmon@latest && asynqmon --redis-addr=localhost:6379

volumes:
  mysql_data:
  redis_data:
