name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/api/go.sum
            apps/ai-worker/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Go workspace
        run: go test ./apps/api/... ./apps/ai-worker/... ./pkg/exporter ./pkg/llmreview ./pkg/reviewsampling

      - name: Vet Go workspace
        run: go vet ./apps/api/... ./apps/ai-worker/... ./pkg/exporter ./pkg/llmreview ./pkg/reviewsampling

      - name: Check generated OpenAPI types
        run: |
          cmp docs/openapi.yaml submission/api/openapi.yaml
          pnpm -F web gen:api
          git diff --exit-code -- apps/web/src/shared/api/schema.d.ts

      - name: Test web
        run: pnpm -F web test

      - name: Lint web
        run: pnpm -F web lint

      - name: Build web
        run: pnpm -F web build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: apps/api/go.sum

      - name: Test API integration
        run: go test -tags=integration ./apps/api/internal/integration -count=1
